<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mantra: The Resonant World</title>
  <meta name="description" content="A Sanskrit etymology adventure game.">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MANTRA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&family=Uncial+Antiqua&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Optimus Princeps';
      src: url('Optimus Princeps/OptimusPrinceps.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Optimus Princeps';
      src: url('Optimus Princeps/OptimusPrincepsSemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="mobile-controls" aria-hidden="true">
      <div id="mobile-joystick">
        <div id="mobile-joystick-base">
          <div id="mobile-joystick-stick"></div>
        </div>
      </div>
      <div id="mobile-actions">
        <button type="button" class="mobile-btn mobile-btn-primary" id="btn-mobile-interact" aria-label="Interact">E</button>
        <div id="mobile-menu">
          <button type="button" class="mobile-btn" id="btn-mobile-inv" aria-label="Inventory">I</button>
          <button type="button" class="mobile-btn" id="btn-mobile-book" aria-label="Etymology book">B</button>
        </div>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // The game still works online if service worker registration fails.
        });
      });
    }
  </script>
</body>
</html>
